<!doctype html>
<html lang="zh-CN" class="all-schedule-mode">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f5f4ef"><meta name="description" content="2026/27 欧国联完整赛程，可按联赛、比赛日和球队筛选，并切换本地时间。">
<title>欧国联 2026/27 · 赛程</title>
<style>
:root {
  --ink:#18251f;
  --muted:#778078;
  --paper:#f5f4ef;
  --card:#fffefa;
  --line:#e5e5dc;
  --green:#145b43;
  --lime:#d6fa79;
  --orange:#ff7959;
  --shadow:0 10px 28px #1c35220d
}
* {
  box-sizing:border-box
}
html,body,.wrap {
  overflow-anchor:none
}
html {
  overflow-x:hidden;
  overflow-y:scroll
}
body {
  margin:0;
  background:var(--paper);
  color:var(--ink);
  font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI","Segoe UI Emoji","Apple Color Emoji","Noto Color Emoji","Noto Sans SC","Microsoft YaHei",sans-serif
}
button,input,select {
  font:inherit
}
button {
  cursor:pointer
}
.wrap {
  max-width:1120px;
  margin:auto;
  padding:0 24px
}
.top {
  padding:24px 0 14px;
  display:flex;
  align-items:center;
  justify-content:space-between
}
.brand {
  font-size:12px;
  font-weight:800;
  letter-spacing:.13em;
  color:var(--green)
}
.edition {
  font-size:12px;
  color:var(--muted)
}
.hero {
  background:var(--green);
  border-radius:26px;
  padding:34px 38px;
  color:white;
  position:relative;
  overflow:hidden;
  min-height:205px;
  display:flex;
  align-items:end;
  justify-content:space-between
}
.hero:after {
  content:"";
  position:absolute;
  width:260px;
  height:260px;
  border:1px solid #ffffff26;
  border-radius:50%;
  right:70px;
  top:-120px;
  box-shadow:0 0 0 32px #ffffff09,0 0 0 68px #ffffff07
}
.hero h1 {
  font-size:clamp(32px,5vw,54px);
  letter-spacing:-.055em;
  line-height:1;
  margin:0 0 12px;
  position:relative;
  z-index:1
}
.hero p {
  margin:0;
  color:#d1e2d7;
  font-size:14px;
  position:relative;
  z-index:1
}
.hero-right {
  z-index:1;
  text-align:right
}
.live-pill {
  display:inline-flex;
  align-items:center;
  gap:8px;
  border:1px solid #ffffff50;
  border-radius:99px;
  padding:8px 12px;
  font-size:12px;
  color:white
}
.dot {
  width:7px;
  height:7px;
  border-radius:50%;
  background:var(--lime)
}
.hero-date {
  font-weight:600;
  font-size:13px;
  line-height:1.4;
  margin-top:11px;
  color:#d1e2d7;
  text-align:left
}
.tools {
  display:flex;
  gap:10px;
  align-items:center;
  flex-wrap:wrap;
  margin:22px 0 15px
}
.tools .search input,.tools select,.tools .toggle {
  font-size:13px
}
.search {
  flex:1;
  min-width:190px;
  position:relative
}
.search input {
  width:100%;
  height:44px;
  border:1px solid var(--line);
  border-radius:12px;
  padding:0 72px 0 40px;
  background:var(--card);
  outline:none;
  color:var(--ink)
}
.team-search-candidates {
  position:absolute;
  z-index:40;
  top:calc(100% + 6px);
  left:0;
  max-height:min(360px,60vh);
  overflow:auto;
  padding:6px;
  background:var(--card);
  border:1px solid var(--line);
  border-radius:12px;
  box-shadow:0 12px 28px #18251f24
}
.team-search-candidates[hidden] {
  display:none
}
.team-search-option {
  display:flex;
  width:100%;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  padding:9px 10px;
  border:0;
  border-radius:8px;
  background:transparent;
  color:var(--ink);
  text-align:left;
  font:inherit;
  cursor:pointer
}
.team-search-option:hover,.team-search-option:focus {
  background:#edf4ee;
  outline:0
}
.team-search-hint {
  padding:6px 10px;
  color:var(--muted);
  font-size:11px
}
.team-search-option b {
  font-size:13px
}
.candidate-star {
  margin-left:4px;
  color:#d59b27;
  font-size:14px;
  line-height:1
}
.team-search-option small {
  color:var(--muted);
  font-size:11px;
  text-align:right
}
.search input:focus,select:focus {
  border-color:var(--green)
}
.search:before {
  content:"⌕";
  position:absolute;
  left:14px;
  top:6px;
  font-size:24px;
  color:var(--muted)
}
select,.toggle {
  height:44px;
  border:1px solid var(--line);
  border-radius:12px;
  background:var(--card);
  padding:0 13px;
  color:var(--ink)
}
.toggle {
  display:flex;
  align-items:center;
  gap:8px;
  font-size:13px
}
.switch-ui {
  position:relative;
  display:inline-block;
  width:30px;
  height:17px;
  flex:0 0 30px;
  border-radius:99px;
  background:#cbd0ca;
  transition:background .18s
}
.switch-ui i {
  position:absolute;
  left:2px;
  top:2px;
  width:13px;
  height:13px;
  border-radius:50%;
  background:white;
  box-shadow:0 1px 3px #0003;
  transition:transform .18s
}
#liveOnly[aria-pressed="true"] .switch-ui,#finishedOnly[aria-pressed="true"] .switch-ui {
  background:var(--green)
}
#liveOnly[aria-pressed="true"] .switch-ui i,#finishedOnly[aria-pressed="true"] .switch-ui i {
  transform:translateX(13px)
}
.toggle input {
  accent-color:var(--green)
}
.date-nav-wrap {
  display:flex;
  align-items:center;
  gap:7px;
  min-width:0
}
.date-arrow {
  flex:0 0 34px;
  width:34px;
  height:38px;
  border:1px solid var(--line);
  border-radius:10px;
  background:var(--card);
  color:var(--green);
  font-size:22px;
  line-height:1
}
.date-arrow:hover {
  background:#e8f1eb
}
.date-nav {
  flex:1;
  min-width:0;
  display:flex;
  gap:8px;
  overflow-x:auto;
  overflow-y:hidden;
  padding:3px 0 12px;
  scrollbar-width:none;
  touch-action:pan-x;
  scroll-snap-type:x proximity;
  -webkit-overflow-scrolling:touch
}
.date-nav::-webkit-scrollbar {
  display:none
}
.day-tab {
  scroll-snap-align:center;
  flex:0 0 auto;
  border:1px solid var(--line);
  background:transparent;
  color:var(--muted);
  border-radius:12px;
  min-width:80px;
  padding:10px 12px;
  text-align:left;
  white-space:nowrap
}
.day-tab b {
  display:block;
  color:inherit;
  font-size:14px
}
.day-tab small {
  font-size:10px
}
.day-tab.active {
  background:var(--ink);
  color:white;
  border-color:var(--ink)
}
.summary {
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin:18px 0 12px;
  font-size:13px;
  color:var(--muted)
}
.summary strong {
  color:var(--ink)
}
.matches {
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:12px;
  align-items:start
}
.match {
  background:var(--card);
  border:1px solid var(--line);
  border-radius:16px;
  padding:16px 17px;
  box-shadow:var(--shadow);
  min-width:0;
  transition:transform .15s;
  height:212px;
  display:flex;
  flex-direction:column
}
.match.expanded,.match.has-goals {
  height:auto;
  min-height:212px
}
.teams {
  flex:1
}
.match:hover {
  transform:none
}
.match {
  cursor:default
}
.match.live-hidden {
  display:none!important
}
.match:focus-visible {
  outline:3px solid var(--green);
  outline-offset:2px
}
.match-detail {
  display:none;
  flex:0 0 auto;
  border-top:1px solid var(--line);
  margin-top:10px;
  padding-top:8px;
  cursor:default
}
.detail-toggle {
  font-size:10px;
  font-weight:750;
  background:#e8f1eb;
  border-radius:6px;
  padding:5px 8px;}
.match-top .detail-toggle {
  margin-left:auto
}
.match-detail.open {
  display:block
}
.match-detail-content {
  padding-top:8px
}
.detail-heading {
  font-size:12px;
  font-weight:750;
  margin:0 0 9px
}
.detail-meta {
  display:flex;
  flex-wrap:wrap;
  gap:6px 14px;
  margin-bottom:13px;
  color:var(--muted);
  font-size:11px
}
.lineup-grid {
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px
}
.lineup-side {
  min-width:0;
  background:#f7f7f2;
  border-radius:10px;
  padding:10px
}
.lineup-side h4 {
  font-size:12px;
  margin:0 0 8px
}
.lineup-list {
  display:grid;
  gap:5px
}
.lineup-player {
  display:flex;
  gap:6px;
  font-size:11px
}
.lineup-player>span {
  min-width:0
}
.appearance-status {
  display:block;
  margin-top:2px;
  color:var(--green);
  font-size:10px;
  font-weight:650
}
.appearance-status:empty {
  display:none
}
.substitution-arrow {
  display:inline-block;
  margin-left:4px;
  font-size:17px;
  font-weight:1000;
  -webkit-text-stroke:.45px currentColor;
  line-height:1;
  vertical-align:-2px
}
.substitution-arrow.down {
  color:#b74b36
}
.substitution-arrow.up {
  color:#16814b
}
.substitution-time {
  display:inline-block;
  margin-left:3px;
  color:#16814b;
  font-size:10px;
  font-weight:750;
  line-height:1;
  vertical-align:1px
}
.lineup-player b {
  color:var(--green);
  min-width:19px
}
.rotation-heading {
  margin-top:16px
}
.detail-note,.detail-loading {
  margin:8px 0 0;
  color:var(--muted);
  font-size:11px
}
@media(max-width:500px) {
  .lineup-grid {
    grid-template-columns:1fr
  }
}
.match-top {
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:15px
}
.tags {
  display:flex;
  gap:6px
}
.tag {
  font-size:10px;
  font-weight:750;
  letter-spacing:.04em;
  background:#edf0e9;
  color:#45534a;
  padding:5px 8px;
  border-radius:6px
}
.tag.group {
  background:#e8f1eb;
  color:var(--green)
}
.detail-toggle {
  border:0;
  cursor:pointer;
  color:var(--green);
  white-space:nowrap
}
.star {
  border:0;
  background:transparent;
  font-size:20px;
  line-height:1;
  color:#b6b9b1;
  padding:0 2px
}
.star.on {
  color:#d59b27
}
.teams {
  display:grid;
  grid-template-columns:minmax(0,1fr) 44px minmax(0,1fr);
  align-items:center;
  gap:6px
}
.team-unit {
  position:relative;
  align-self:start;
  display:grid;
  grid-template-rows:18px auto;
  align-content:start;
  gap:4px;
  min-width:0
}
.team-unit.away {
  justify-items:end
}
.role-mark {
  grid-row:1;
  align-self:start;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  width:48px;
  font-size:9px;
  font-weight:750;
  color:var(--green);
  background:#e7f1eb;
  border-radius:5px;
  padding:3px 6px
}
.team-unit>.team,.team-unit.away>.team {
  grid-row:2;
  align-self:start
}
.team-unit.away .role-mark {
  color:#a6532c;
  background:#fff0e7
}
.match-meta {
  min-width:0;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap
}
.match-meta em {
  font-style:normal;
  color:inherit;
  font-weight:inherit
}
.match-bottom {
  gap:8px
}
.match-bottom .kick {
  flex-shrink:0
}
.team {
  align-self:flex-start;
  max-width:100%;
  font-size:15px;
  font-weight:720;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
  border:0;
  background:transparent;
  color:var(--ink);
  padding:2px 0;
  text-align:left
}
.team.away {
  align-self:flex-end;
  text-align:right
}
.team.selected {
  color:var(--ink);
  text-decoration:none;
  background:transparent;
  border-radius:0;
  padding:2px 0
}
.team-label {
  display:inline-flex;
  flex-direction:column;
  line-height:1.2;
  vertical-align:middle
}
.team-cn {
  font-size:14px;
  font-weight:750;
  color:var(--ink)
}
.team-en {
  display:flex;
  align-items:center;
  gap:4px;
  margin-top:2px;
  font-size:10px;
  line-height:1.1;
  font-weight:550;
  color:var(--muted)
}

.team-name {
  display:flex;
  flex-direction:column;
  align-items:flex-start;
  white-space:normal;
  line-height:1.2
}
.team.away .team-name {
  align-items:flex-end
}
.team.selected {
  overflow:visible
}
.team.selected .team-name {
  position:relative;
  isolation:isolate;
  background:transparent;
  border:0;
  border-radius:0;
  padding:0;
  text-decoration:none
}
.team.selected .team-name:before {
  content:none!important
}
.team.selected .team-label {
  position:relative;
  isolation:isolate
}
.team.selected .team-label:before {
  content:'';
  position:absolute;
  z-index:-1;
  inset:-3px -5px;
  box-sizing:border-box;
  background:var(--lime);
  border-radius:8px;
  box-shadow:inset 0 -2px 0 var(--green)
}
.team.away.selected {
  text-align:right
}
.versus {
  font-size:10px;
  color:#a3aaa1;
  text-align:center;
  font-weight:700
}
.versus.score-center {
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:3px;
  font-size:17px;
  color:var(--ink);
  font-variant-numeric:tabular-nums;
  letter-spacing:-.03em
}
.score-main {
  font-size:17px;
  font-variant-numeric:tabular-nums;
  white-space:nowrap
}
.teams.has-goals {
  grid-template-columns:minmax(0,1fr) minmax(190px,62%) minmax(0,1fr)
}
.teams.has-goals .versus.score-center {
  min-width:0;
  width:100%
}
@media(max-width:500px) {
  .teams.has-goals {
    grid-template-columns:minmax(0,1fr) minmax(180px,64%) minmax(0,1fr)
  }
  .teams.has-goals .scorer-side {
    font-size:8px
  }
}
.score-inline {
  display:grid;
  grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);
  align-items:center;
  gap:12px;
  width:100%
}
.score-core {
  position:relative;
  display:flex;
  align-items:center;
  justify-content:center;
  min-width:0
}
.score-core .score-status {
  position:absolute;
  top:calc(100% + 3px);
  left:50%;
  transform:translateX(-50%);
  white-space:nowrap
}
.score-core .match-duration {
  position:absolute;
  top:calc(100% + 17px);
  left:50%;
  transform:translateX(-50%)
}
.scorer-side {
  display:flex;
  flex-direction:column;
  gap:2px;
  min-width:0;
  font-size:9px;
  line-height:1.2;
  color:var(--muted);
  font-weight:550
}
.scorer-side.home {
  align-items:flex-end;
  text-align:right
}
.scorer-side.away {
  align-items:flex-start;
  text-align:left
}
.scorer-item {
  display:flex;
  align-items:flex-start;
  gap:3px;
  min-width:0;
  max-width:100%;
  white-space:normal;
  overflow-wrap:anywhere
}
.scorer-item.home {
  flex-direction:row-reverse;
  text-align:right
}
.scorer-item i {
  flex:0 0 auto;
  font-style:normal;
  font-size:10px;
  line-height:1.1
}
.scorer-item span {
  min-width:0
}
.score-status {
  font-size:9px;
  line-height:1;
  color:#a9472f;
  background:#fff0e7;
  border-radius:99px;
  padding:3px 6px;
  font-style:normal;
  letter-spacing:0
}
.score-status.finished {
  color:#45534a;
  background:#edf0e9
}
.match-bottom {
  border-top:1px solid #eeeee7;
  padding-top:11px;
  margin-top:13px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  color:var(--muted);
  font-size:11px
}
.kick {
  font-size:inherit;
  font-weight:inherit;
  color:inherit
}
.kick em {
  font-style:normal;
  color:inherit;
  font-size:inherit;
  font-weight:inherit;
  margin-left:4px
}
.empty {
  grid-column:1/-1;
  padding:48px 16px;
  text-align:center;
  color:var(--muted);
  border:1px dashed var(--line);
  border-radius:16px
}
.footer {
  padding:30px 0 40px;
  color:var(--muted);
  font-size:11px;
  line-height:1.8
}
.footer a {
  color:var(--green)
}
.hidden {
  display:none!important
}
@media(max-width:700px) {
  .wrap {
    padding:0 15px
  }
  .top {
    padding:16px 0 12px
  }
  .hero {
    min-height:180px;
    padding:25px 22px;
    border-radius:20px
  }
  .hero:after {
    right:-35px
  }
  .hero-right {
    max-width:112px
  }
  .hero-date {
    font-size:12px;
    margin-top:10px
  }
  .hero p {
    max-width:230px;
    line-height:1.55
  }
  .tools {
    margin-top:15px
  }
  .search {
    flex-basis:100%
  }
  .tools select {
    flex:1;
    min-width:0
  }
  .toggle {
    flex:1;
    justify-content:center
  }
  .matches {
    grid-template-columns:1fr;
    gap:9px
  }
  .match {
    padding:14px 15px
  }
  .team {
    font-size:14px
  }
  .day-tab {
    min-width:72px;
    padding:9px 10px
  }
  .footer {
    padding-bottom:calc(28px + env(safe-area-inset-bottom))
  }
  .edition {
    font-size:10px
  }
}
.view-tabs {
  display:flex;
  gap:8px;
  margin:18px 0 12px
}
.view-tab {
  border:1px solid var(--line);
  border-radius:10px;
  background:transparent;
  color:var(--muted);
  padding:10px 16px;
  font-weight:700
}
.view-tab.active {
  background:var(--green);
  border-color:var(--green);
  color:#fff
}
.favorite-manager {
  position:relative
}
.favorite-manager>summary {
  list-style:none;
  display:flex;
  align-items:center;
  gap:6px;
  height:44px;
  padding:0 12px;
  border:1px solid var(--line);
  border-radius:12px;
  background:var(--card);
  font-size:13px;
  font-weight:650;
  cursor:pointer;
  white-space:nowrap
}
.favorite-manager>summary::-webkit-details-marker {
  display:none
}
#favCount {
  display:inline-flex;
  align-items:center;
  justify-content:center;
  min-width:19px;
  height:19px;
  padding:0 5px;
  border-radius:99px;
  background:#edf0e9;
  color:var(--green);
  font-size:11px
}
.favorite-list {
  position:absolute;
  right:0;
  top:calc(100% + 7px);
  z-index:30;
  width:min(320px,88vw);
  max-height:280px;
  overflow:auto;
  padding:8px;
  background:var(--card);
  border:1px solid var(--line);
  border-radius:13px;
  box-shadow:0 12px 30px #18251f24
}
.favorite-item {
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:6px;
  padding:5px;
  border-bottom:1px solid #eeeeea;
  font-size:13px
}
.favorite-filter-all,.favorite-filter-team {
  border:0;
  background:transparent;
  color:var(--ink);
  font:inherit;
  text-align:left;
  cursor:pointer
}
.favorite-filter-all {
  display:block;
  width:100%;
  padding:9px;
  border-radius:8px;
  color:var(--muted);
  font-size:12px
}
.favorite-filter-team {
  flex:1;
  min-width:0;
  padding:5px;

  selects.forEach(select=>{if(select.closest('.custom-select'))return;const wrap=document.createElement('div');wrap.className='custom-select';wrap.dataset.for=select.id;select.parentNode.insertBefore(wrap,select);wrap.append(select);select.classList.add('custom-select-native');select.setAttribute('aria-hidden','true');select.tabIndex=-1;const trigger=document.createElement('button');trigger.type='button';trigger.className='custom-select-trigger';trigger.setAttribute('aria-haspopup','listbox');trigger.setAttribute('aria-expanded','false');trigger.setAttribute('aria-label',select.getAttribute('aria-label')||'选择');const label=document.createElement('span');label.className='custom-select-label';const icon=document.createElementNS('http://www.w3.org/2000/svg','svg');icon.setAttribute('class','custom-select-chevron');icon.setAttribute('viewBox','0 0 12 8');icon.setAttribute('aria-hidden','true');const path=document.createElementNS('http://www.w3.org/2000/svg','path');path.setAttribute('d','M1 1.5 6 6.5 11 1.5');icon.append(path);trigger.append(label,icon);const menu=document.createElement('div');menu.className='custom-select-menu';menu.id='customSelectMenu-'+select.id;menu.setAttribute('role','listbox');menu.hidden=true;trigger.setAttribute('aria-controls',menu.id);wrap.append(trigger,menu);trigger.addEventListener('click',()=>{const opening=trigger.getAttribute('aria-expanded')!=='true';closeAll(wrap);wrap.classList.toggle('is-open',opening);trigger.setAttribute('aria-expanded',String(opening));menu.hidden=!opening;if(opening){const active=menu.querySelector('[aria-selected="true"]:not(:disabled)')||menu.querySelector('.custom-select-option:not(:disabled)');if(active)active.scrollIntoView({block:'nearest'})}});trigger.addEventListener('keydown',event=>{if(event.key==='ArrowDown'||event.key==='ArrowUp'){event.preventDefault();if(trigger.getAttribute('aria-expanded')!=='true')trigger.click();const items=[...menu.querySelectorAll('.custom-select-option:not(:disabled)')];const active=menu.querySelector('[aria-selected="true"]:not(:disabled)');(active||items[0])?.focus()}});select.addEventListener('change',()=>refresh(select));const observer=new MutationObserver(()=>refresh(select));observer.observe(select,{childList:true,subtree:true,attributes:true,characterData:true});refresh(select)});
  document.addEventListener('click',event=>{if(!event.target.closest('.custom-select'))closeAll();if(event.target.closest('#resetFilters,.team-directory-back'))queueMicrotask(()=>selects.forEach(refresh))});document.addEventListener('keydown',event=>{if(event.key==='Escape')closeAll()});
